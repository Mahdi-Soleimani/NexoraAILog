<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="logo-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="logo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Shield -->
  <rect x="4" y="4" width="120" height="120" rx="30" fill="url(#logo-bg)" stroke="url(#logo-border)" stroke-width="3" />
  <rect x="10" y="10" width="108" height="108" rx="24" fill="#1E293B" fill-opacity="0.3" />

  <!-- Neural Nodes -->
  <circle cx="64" cy="42" r="10" fill="#6366F1" filter="url(#logo-glow)" />
  <circle cx="40" cy="82" r="9" fill="#06B6D4" />
  <circle cx="88" cy="82" r="9" fill="#10B981" />
  <circle cx="64" cy="69" r="6" fill="#FFFFFF" />

  <!-- Neural Connectors -->
  <line x1="64" y1="42" x2="40" y2="82" stroke="#818CF8" stroke-width="3.5" stroke-linecap="round" />
  <line x1="64" y1="42" x2="88" y2="82" stroke="#818CF8" stroke-width="3.5" stroke-linecap="round" />
  <line x1="40" y1="82" x2="88" y2="82" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="5,4" />

  <!-- Online Beacon Pulse -->
  <circle cx="110" cy="18" r="5" fill="#10B981" />
</svg>
