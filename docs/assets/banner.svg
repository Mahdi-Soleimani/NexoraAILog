<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A12" />
      <stop offset="50%" stop-color="#0B1120" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9" />
    </linearGradient>

    <radialGradient id="mesh-1" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="mesh-2" cx="80%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="mesh-3" cx="50%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
      <circle cx="40" cy="40" r="1" fill="#475569" fill-opacity="0.4" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="380" fill="url(#bg-grad)" rx="16" />

  <!-- Ambient Glow Meshes -->
  <rect width="1200" height="380" fill="url(#mesh-1)" rx="16" />
  <rect width="1200" height="380" fill="url(#mesh-2)" rx="16" />
  <rect width="1200" height="380" fill="url(#mesh-3)" rx="16" />

  <!-- Geometric Grid Overlay -->
  <rect width="1200" height="380" fill="url(#grid)" rx="16" />

  <!-- Outer Glass Border -->
  <rect x="1" y="1" width="1198" height="378" rx="15" fill="none" stroke="url(#primary-glow)" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Floating Telemetry Waves (Vector Path) -->
  <path d="M 50 280 Q 250 240, 450 290 T 850 260 T 1150 290" fill="none" stroke="#6366F1" stroke-width="2" stroke-opacity="0.3" />
  <path d="M 50 300 Q 300 320, 600 270 T 950 310 T 1150 270" fill="none" stroke="#06B6D4" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="6,4" />

  <!-- Left Icon / Branding Emblem -->
  <g transform="translate(90, 85)" filter="url(#soft-shadow)">
    <!-- Outer Octagon / Shield -->
    <rect x="0" y="0" width="120" height="120" rx="28" fill="#0F172A" stroke="url(#primary-glow)" stroke-width="2" />
    <rect x="6" y="6" width="108" height="108" rx="22" fill="#1E293B" fill-opacity="0.5" />

    <!-- Pulse Icon / Brain AI Nodes -->
    <circle cx="60" cy="40" r="8" fill="#6366F1" filter="url(#glow)" />
    <circle cx="38" cy="76" r="7" fill="#06B6D4" />
    <circle cx="82" cy="76" r="7" fill="#10B981" />
    <circle cx="60" cy="65" r="5" fill="#FFFFFF" />

    <!-- Neural Connectors -->
    <line x1="60" y1="40" x2="38" y2="76" stroke="#818CF8" stroke-width="2.5" stroke-opacity="0.8" />
    <line x1="60" y1="40" x2="82" y2="76" stroke="#818CF8" stroke-width="2.5" stroke-opacity="0.8" />
    <line x1="38" y1="76" x2="82" y2="76" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.6" stroke-dasharray="4,3" />

    <!-- Pulse Indicator Beacon -->
    <circle cx="106" cy="14" r="5" fill="#10B981" />
    <circle cx="106" cy="14" r="9" fill="#10B981" fill-opacity="0.3">
      <animate attributeName="r" values="7;14;7" dur="2.5s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.6;0;0.6" dur="2.5s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Typography & Headings -->
  <g transform="translate(245, 120)">
    <!-- Pill Badge -->
    <g transform="translate(0, -25)">
      <rect x="0" y="0" width="230" height="28" rx="14" fill="#1E1B4B" stroke="#4F46E5" stroke-width="1" />
      <circle cx="16" cy="14" r="4" fill="#22D3EE" />
      <text x="28" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#A5B4FC" letter-spacing="0.5">NEXT-GEN AI OBSERVABILITY</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="900" fill="url(#text-gradient)" letter-spacing="-1">
      Nexora AI Monitor
    </text>

    <!-- Subtitle -->
    <text x="0" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#94A3B8" letter-spacing="0.1">
      Real-Time Agent Intelligence, Multi-Channel Auditing &amp; Telemetry Dashboard
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 115)">
      <!-- Pill 1: Gemini AI 2.0 -->
      <g transform="translate(0, 0)">
        <rect width="138" height="32" rx="16" fill="url(#badge-grad)" stroke="#334155" stroke-width="1" />
        <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#E2E8F0">✦ Gemini 2.0 Flash</text>
      </g>
      <!-- Pill 2: Real-time Telemetry -->
      <g transform="translate(148, 0)">
        <rect width="158" height="32" rx="16" fill="url(#badge-grad)" stroke="#334155" stroke-width="1" />
        <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#38BDF8">⚡ Real-Time Metrics</text>
      </g>
      <!-- Pill 3: Bilingual RTL/LTR -->
      <g transform="translate(316, 0)">
        <rect width="152" height="32" rx="16" fill="url(#badge-grad)" stroke="#334155" stroke-width="1" />
        <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#A7F3D0">🌐 Bilingual &amp; RTL</text>
      </g>
      <!-- Pill 4: Docker Ready -->
      <g transform="translate(478, 0)">
        <rect width="136" height="32" rx="16" fill="url(#badge-grad)" stroke="#334155" stroke-width="1" />
        <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#FDE047">🐳 Docker Ready</text>
      </g>
      <!-- Pill 5: Zero Leak Clean -->
      <g transform="translate(624, 0)">
        <rect width="136" height="32" rx="16" fill="url(#badge-grad)" stroke="#334155" stroke-width="1" />
        <text x="14" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#F472B6">🛡️ DevSecOps Clean</text>
      </g>
    </g>
  </g>

  <!-- Right Decorative Telemetry Cards (Mini Preview) -->
  <g transform="translate(1005, 55)" filter="url(#soft-shadow)">
    <!-- Floating KPI 1 -->
    <g transform="translate(0, 0)">
      <rect width="130" height="70" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#94A3B8">AVG LATENCY</text>
      <text x="14" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#22D3EE">240ms</text>
      <path d="M 85 45 L 95 38 L 105 42 L 115 32" fill="none" stroke="#22D3EE" stroke-width="2" stroke-linecap="round" />
    </g>
    <!-- Floating KPI 2 -->
    <g transform="translate(-25, 82)">
      <rect width="155" height="70" rx="12" fill="#0F172A" stroke="#4F46E5" stroke-width="1.5" />
      <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#A5B4FC">SUCCESS RATE</text>
      <text x="14" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#10B981">99.4%</text>
      <circle cx="132" cy="40" r="6" fill="#10B981" />
    </g>
    <!-- Floating KPI 3 -->
    <g transform="translate(0, 164)">
      <rect width="130" height="70" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#94A3B8">ACTIVE USERS</text>
      <text x="14" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#F59E0B">12,480</text>
    </g>
  </g>
</svg>
